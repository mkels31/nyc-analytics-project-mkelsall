name: 'nyc_analytics'
version: '1.0.0'
config-version: 2

profile: 'default'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"

clean-targets:
  - "target"
  - "dbt_packages"

models:
  nyc_analytics:
    +materialized: table

    assignment_work:
      staging:
        +materialized: view
        +schema: nyc_rodent_restaurants_staging

        rodent_311:
          +materialized: view

        restaurant_inspections:
          +materialized: view

      marts:
        +materialized: table
        +schema: nyc_rodent_restaurants_marts

        dimensions:
          +materialized: table

        facts:
          +materialized: table

        analytics:
          +materialized: table
